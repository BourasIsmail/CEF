# Profil de développement : jeu de données fictif (db/seed-dev) + documentation OpenAPI.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev

cef:
  security:
    cookie-secure: ${COOKIE_SECURE:false}   # développement local en HTTP

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    ma.entraidenationale.cef: DEBUG
