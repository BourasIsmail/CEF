# Configuration commune. Tout ce qui est sensible ou propre à l'environnement vient de variables
# d'environnement (voir .env.example) : aucun secret n'est committé.
spring:
  application:
    name: cef-manager
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma appartient à Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: true        # une base de développement (jeu V100 déjà appliqué) accepte les migrations V10+ ajoutées ensuite
  servlet:
    multipart:
      max-file-size: 20MB      # pièces des demandes de filière
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cef:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    dir: ${FILE_STORAGE_DIR:./data/uploads}
  security:
    jwt-secret: ${JWT_SECRET}                      # obligatoire, 32 octets minimum (openssl rand -base64 48)
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P7D}
    cookie-secure: ${COOKIE_SECURE:true}           # false uniquement en développement local en HTTP
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
    max-failed-attempts: 5
    lock-duration: PT15M
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:${BOOTSTRAP_ADMIN_USERNAME:}}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
