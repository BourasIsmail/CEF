# Configuration commune. Tout ce qui est sensible ou propre à l'environnement vient de variables
# d'environnement (voir .env.example) : aucun secret n'est committé.
spring:
  application:
    name: cef-manager
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma appartient à Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB      # pièces des demandes de filière
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

cef:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    dir: ${FILE_STORAGE_DIR:./data/uploads}
