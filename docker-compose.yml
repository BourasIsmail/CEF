# CEF-Manager : MySQL + backend (+ frontend, profil « frontend »).
#
#   cp .env.example .env        # puis renseigner les mots de passe
#   docker compose up --build   # base + API
#   docker compose --profile frontend up --build   # + interface (dès que /frontend existe)
#
# Les variables marquées :? sont obligatoires : aucune valeur par défaut n'est embarquée.

name: cef-manager

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cef_manager}
      MYSQL_USER: ${MYSQL_USER:-cef}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"   # exposé en local uniquement
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-cef_manager}?connectionTimeZone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-cef}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FILE_STORAGE_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis (openssl rand -base64 48)}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P7D}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080   # relais /api (réseau interne compose)
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db_data:
  uploads:
